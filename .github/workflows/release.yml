# Release (ROADMAP P8-T8): publish a GitHub Release with Linux x64 and arm64
# binaries and a SHA256SUMS file. Two ways in:
#
#   A. Push to the `stable` branch. The version comes from package.json; if
#      tag v<version> does not exist yet, the release is built, tagged on the
#      pushed commit, and published. If that version is already released the
#      run succeeds without publishing and says to bump the version, so a
#      docs-only push to stable never fails or duplicates a release.
#   B. Push a tag vX.Y.Z by hand (it must equal "v" + package.json version).
#
# Versions below 1.0.0, or with a pre-release suffix (1.0.0-rc.1), are marked
# as pre-releases. The full check runs again before anything is built, and
# each binary is built and smoke-tested on its own architecture by the same
# script CI uses (scripts/build-release.sh).
name: Release

on:
  push:
    branches: [stable]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Version, tag, and whether to publish
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=$(bun -e 'console.log(require("./package.json").version)')
          if ! [[ "$pkg" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version $pkg is not MAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          tag="v$pkg"
          publish=true
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $REF_NAME does not match package.json version $pkg"
              exit 1
            fi
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            # Branch push (stable) of a version that is already released.
            echo "::notice::$tag is already released; nothing published. Bump \"version\" in package.json to release this commit."
            publish=false
          fi
          prerelease=false
          if [[ "$pkg" == 0.* || "$pkg" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$pkg"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    name: Build linux-${{ matrix.arch }}
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build, smoke-test and package
        run: scripts/build-release.sh "$ARCH" "$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.verify.outputs.version }}
          SMOKE_CONTAINER: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podtui-linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: podtui-linux-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          flags=(--generate-notes --title "podtui $VERSION")
          if [[ "$REF_TYPE" == "tag" ]]; then
            flags+=(--verify-tag)
          else
            # From the stable branch: create the tag on exactly the commit
            # that was checked and built.
            flags+=(--target "$GITHUB_SHA")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
