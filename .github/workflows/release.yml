# Release (ROADMAP P8-T8): push a tag `vX.Y.Z` to publish a GitHub Release
# with Linux x64 and arm64 binaries and a SHA256SUMS file.
#
#   1. Bump "version" in package.json, commit, merge to main.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag must equal "v" + package.json version, or nothing is published.
# Versions below 1.0.0, or with a pre-release suffix (1.0.0-rc.1), are marked
# as pre-releases. The full check runs again before anything is built, and
# each binary is built and smoke-tested on its own architecture by the same
# script CI uses (scripts/build-release.sh).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Tag must match package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          pkg=$(bun -e 'console.log(require("./package.json").version)')
          if [[ "$version" != "$pkg" ]]; then
            echo "::error::Tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    name: Build linux-${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build, smoke-test and package
        run: scripts/build-release.sh "$ARCH" "$VERSION"
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.verify.outputs.version }}
          SMOKE_CONTAINER: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podtui-linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: podtui-linux-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "podtui $VERSION")
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
